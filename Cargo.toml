[package]
name = "conntrack_exporter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

# Declared here rather than passed on the command line, so `cargo clippy` in a
# terminal checks exactly what CI does.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
